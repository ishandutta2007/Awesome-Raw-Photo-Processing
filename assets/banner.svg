<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes rotateAperture {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 3.5px; opacity: 0.8; }
        50% { r: 5.5px; opacity: 1; }
      }

      .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; transform-origin: center; }
      .floating-pill-2 { animation: floatSlow2 8.5s ease-in-out infinite; transform-origin: center; }
      .floating-pill-3 { animation: floatSlow1 6s ease-in-out infinite; transform-origin: center; }
      .glow-pulse-1 { animation: pulseGlow 6s ease-in-out infinite alternate; transform-origin: center; }
      .glow-pulse-2 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: center; }
      .rotating-aperture { animation: rotateAperture 90s linear infinite; transform-origin: 980px 200px; }
      .animated-wave { stroke-dasharray: 20 8; animation: waveFlow 25s linear infinite; }
      .record-dot { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs (Background layer) -->
  <circle cx="180" cy="120" r="140" fill="url(#glowGrad1)" filter="url(#glow)" class="glow-pulse-1" />
  <circle cx="1020" cy="280" r="160" fill="url(#glowGrad2)" filter="url(#glow)" class="glow-pulse-2" />
  <circle cx="600" cy="360" r="130" fill="url(#glowGrad1)" filter="url(#glow)" class="glow-pulse-2" />

  <!-- Background Grid Lines (Camera Sensor / Bayer Array Motif) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Stylized Rotating Aperture / Camera Shutter in Background (Right side) -->
  <g class="rotating-aperture" opacity="0.14">
    <circle cx="980" cy="200" r="140" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="12 6" />
    <circle cx="980" cy="200" r="100" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="980" cy="200" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" />
    <!-- Aperture Blades -->
    <path d="M 980 60 L 1050 150 L 980 180 Z" fill="#818cf8" />
    <path d="M 1120 200 L 1030 270 L 1000 200 Z" fill="#c084fc" />
    <path d="M 980 340 L 910 250 L 980 220 Z" fill="#38bdf8" />
    <path d="M 840 200 L 930 130 L 960 200 Z" fill="#f43f5e" />
  </g>

  <!-- Animated Sensor RGB Tone Curve / Waveform in Background -->
  <path d="M 0 350 Q 250 370 450 330 T 800 350 T 1200 320" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.25" class="animated-wave" />
  <path d="M 0 365 Q 300 330 600 360 T 1200 340" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.2" class="animated-wave" />

  <!-- Dynamic Floating Feature Pills (Positioned safely around edges) -->
  <g class="floating-pill-1" filter="url(#shadow)">
    <rect x="70" y="45" width="225" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="88" cy="64" r="5" fill="#38bdf8" />
    <text x="102" y="69" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">⚡ GPU DEMOSAIC &amp; NIND</text>
  </g>

  <g class="floating-pill-2" filter="url(#shadow)">
    <rect x="910" y="45" width="225" height="38" rx="19" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="928" cy="64" r="5" fill="#a855f7" />
    <text x="942" y="69" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">🤖 LOCAL AI MASKS &amp; SAM-2</text>
  </g>

  <g class="floating-pill-3" filter="url(#shadow)">
    <rect x="930" y="325" width="215" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="948" cy="343" r="5" fill="#10b981" />
    <text x="962" y="348" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">🎞️ 32-BIT SCENE-REFERRED</text>
  </g>

  <!-- Central Glassmorphic Scrim (Ensures Title & Subtitle Are Always Crystal Clear) -->
  <rect x="110" y="105" width="980" height="190" rx="20" fill="#0b1120" fill-opacity="0.82" stroke="url(#primaryGrad)" stroke-width="1.2" stroke-opacity="0.5" filter="url(#shadow)" />

  <!-- RAW Status Tag Header -->
  <g transform="translate(145, 138)">
    <rect x="0" y="0" width="128" height="24" rx="12" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-opacity="0.5" />
    <circle cx="14" cy="12" r="4" fill="#ef4444" class="record-dot" />
    <text x="26" y="16" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">RAW SENSOR</text>

    <rect x="138" y="0" width="138" height="24" rx="12" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.5" />
    <text x="149" y="16" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">NON-DESTRUCTIVE</text>

    <rect x="286" y="0" width="158" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.5" />
    <text x="297" y="16" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">OPEN ECOSYSTEM</text>
  </g>

  <!-- MAIN FOREGROUND HEADINGS (Guaranteed on Top Layer) -->
  <text x="145" y="210" fill="url(#primaryGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.8">
    Awesome RAW Photo Processing
  </text>

  <text x="145" y="252" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" letter-spacing="0.2">
    Curated Open-Source Engines &amp; SaaS Suites • Scene-Referred Color Pipelines • Local AI Denoising
  </text>

  <!-- Technical Spec Footprint Pill inside Scrim -->
  <g transform="translate(145, 268)">
    <text x="0" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
      ⚡ Bayer &amp; X-Trans Demosaic  |  🎯 Lensfun Optics  |  🔬 Floating-Point Math  |  🔒 Zero Cloud Telemetry
    </text>
  </g>
</svg>
